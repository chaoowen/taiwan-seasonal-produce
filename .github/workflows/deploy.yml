# Deploys the site to Cloudflare Workers with a fresh wholesale price snapshot.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  schedule:
    # GitHub delays or skips scheduled runs under load (06:00 sharp was skipped two days running), worst on
    # the hour, so three slots off the hour; any one of them refreshes the day's prices.
    # 22:47 UTC = 06:47 Asia/Taipei, after the MOA publishes the previous day's trades.
    - cron: '47 22 * * *'
    # 00:17 UTC = 08:17 and 02:37 UTC = 10:37 Asia/Taipei: backup slots.
    - cron: '17 0 * * *'
    - cron: '37 2 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Settled MOA days never change: keep them between runs so only the last few days are fetched.
      - uses: actions/cache@v4
        with:
          path: .cache/moa
          key: moa-${{ github.run_id }}
          restore-keys: moa-

      # Full Noto TC fonts (~28 MB) that scripts/subset-fonts.ts cuts down to the site's characters.
      - uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-noto-tc-v1

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:worker

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
